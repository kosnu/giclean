name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.89.0 fmt --all -- --check
      - name: Lint
        run: cargo +1.89.0 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: |
          cargo +1.89.0 test --locked --all-targets
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build release binary
        run: cargo +1.89.0 build --locked --release
      - name: Check wall-clock performance
        shell: bash
        env:
          PERFORMANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$PERFORMANCE_BASE" || "$PERFORMANCE_BASE" == 0000000000000000000000000000000000000000 ]]; then
            if ! PERFORMANCE_BASE=$(git rev-parse --verify HEAD^); then
              echo 'Performance comparison skipped: the initial commit has no baseline.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if ! git cat-file -e "$PERFORMANCE_BASE^{commit}"; then
            git fetch --no-tags origin "$PERFORMANCE_BASE"
          fi
          baseline_dir=$(mktemp -d)
          trap 'rm -rf "$baseline_dir"' EXIT
          git archive "$PERFORMANCE_BASE" | tar -x -C "$baseline_dir"
          cargo +1.89.0 build --locked --release --manifest-path "$baseline_dir/Cargo.toml" --target-dir "$baseline_dir/target"
          echo "Performance baseline: $PERFORMANCE_BASE; candidate: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/check_performance.py \
            --baseline "$baseline_dir/target/release/giclean" \
            --candidate target/release/giclean
